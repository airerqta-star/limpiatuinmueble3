<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">RELEVAMIENTO FOTOGRÁFICO - Reconquista</title>
    
    <!-- ============================================================= -->
    <!-- ETIQUETAS OPEN GRAPH (PARA COMPARTIR EN WHATSAPP/REDES) -->
    <!-- Se actualiza con la nueva imagen (usamos la miniatura específica) -->
    <!-- ============================================================= -->
    <meta property="og:title" content="RELEVAMIENTO FOTOGRÁFICO">
    <meta property="og:description" content="Detalles del expediente 1853/2025: Fanto Alejandra s/ inmueble falto de Higiene">
    
    <!-- URL DE IMAGEN ACTUALIZADA (Usando la miniatura PLANTILLAMINIATURA2.jpg) -->
    <meta property="og:image" content="https://raw.githubusercontent.com/airerqta-star/limpiatuinmueble3/e8fe272b2f7322669b36f079b17722684d4c1aed/PLANTILLAMINIATURA2.jpg"> 
    
    <meta property="og:url" content=""> 
    <meta property="og:type" content="website">
    
    <!-- Dimensiones de la imagen (4:3 horizontal es un estimado) -->
    <meta property="og:image:width" content="1200">   
    <meta property="og:image:height" content="900">  

    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de fuente Inter -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        :root {
            font-family: 'Inter', sans-serif;
        }

        /* Estilos para el iframe que deben ser fluidos */
        .pdf-iframe {
            width: 100%;
            height: 80vh; 
            border: none;
        }

        /* -------------------------------------------------------------------
           ESTILOS CRÍTICOS PARA IMPRESIÓN 
           ------------------------------------------------------------------- */
        
        .print-area {
            max-width: 8.5in;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        @media print {
            /* Oculta el botón y la sección de PDFs */
            .print-button-container, .pdf-container {
                display: none;
            }
            @page {
                margin: 2cm; 
            }
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                overflow: visible; 
            }
            .print-area {
                box-shadow: none;
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-4 sm:p-8">

    <!-- 
        ===================================================================
        PASO 1: EDITA ESTE OBJETO PARA CAMBIAR EL CASO
        =================================================================== 
        Información del Expediente N° 1853/2025 - Fanto Alejandra s/ inmueble falto de higiene
    -->
    <script>
        // URL base para el contenido RAW de GitHub (usado solo para fotos)
        // Se actualiza el commit SHA para reflejar el nuevo enlace de la miniatura
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/airerqta-star/limpiatuinmueble3/e4ba1312afa2d9c006f0581f7f67bc2860f92b87/";
        // Base para la miniatura
        const MINIAMTURA_RAW_URL = "https://raw.githubusercontent.com/airerqta-star/limpiatuinmueble3/e8fe272b2f7322669b36f079b17722684d4c1aed/PLANTILLAMINIATURA2.jpg";
        
        const currentCaseData = {
            title: "Fanto Alejandra s/ inmueble falto de higiene",
            expedient: "1853/2025",
            address: "Alvear N° 1375",
            date: "17/10/2025", // Asumiendo una fecha cercana a la del expediente
            
            // ATENCIÓN: Esta URL es la que se usará para la miniatura (ACTUALIZADA)
            ogImageUrl: MINIAMTURA_RAW_URL, 
            
            // Dimensiones de la imagen para la previsualización (Open Graph)
            ogImageWidth: "1200",
            ogImageHeight: "900",

            // Lista de URLs de Fotos (horizontal o vertical)
            photos: [
                { 
                    url: GITHUB_RAW_BASE + "01fantovistaprincipalv1.jpeg", 
                    caption: "Vista Principal del inmueble y el estado de la vereda.", 
                    aspect: "4/3", // Horizontal (asumido)
                    alt: "FOTOGRAFÍA 1 (Vista Principal) - Inmueble falto de higiene" 
                },
                { 
                    url: GITHUB_RAW_BASE + "02vistadelavereda.jpeg", 
                    caption: "Detalle del estado de la vereda y acumulación de residuos.", 
                    aspect: "4/3", // Horizontal (asumido)
                    alt: "FOTOGRAFÍA 2 (Vereda) - Inmueble falto de higiene"
                },
                { 
                    url: GITHUB_RAW_BASE + "03fantonoche.jpg", 
                    caption: "Vista nocturna del inmueble, confirmando la situación.", 
                    aspect: "4/3", // Horizontal (asumido)
                    alt: "FOTOGRAFÍA 3 (Vista Nocturna) - Inmueble falto de higiene"
                },
                { 
                    url: GITHUB_RAW_BASE + "04fantov3.jpeg", 
                    caption: "Otra perspectiva de la fachada y el estado de abandono.", 
                    aspect: "4/3", // Horizontal (asumido)
                    alt: "FOTOGRAFÍA 4 (Perspectiva) - Inmueble falto de higiene"
                },
                { 
                    url: GITHUB_RAW_BASE + "05notificacionfija.jpeg", 
                    caption: "Detalle de la notificación fijada en el domicilio.", 
                    aspect: "3/4", // Vertical (asumido)
                    alt: "FOTOGRAFÍA 5 (Notificación Fijada) - Inmueble falto de higiene"
                },
                { 
                    url: GITHUB_RAW_BASE + "06notificacionfijada.jpeg", 
                    caption: "Otra vista de la notificación aplicada como medida de seguridad.", 
                    aspect: "3/4", // Vertical (asumido)
                    alt: "FOTOGRAFÍA 6 (Medida de Seguridad) - Inmueble falto de higiene"
                },
            ],

            // Lista de URLs de PDF (Apuntando a Google Drive en formato /preview)
            pdfs: [
                { 
                    // Edicto E-1853-2025-1 (Google Drive /preview)
                    url: "https://drive.google.com/file/d/1SZXMqLzStU3fcynJxIEO8ib-XAo9kruv/preview", 
                    tabTitle: "EDICTO E-1853-2025-1" 
                },
                { 
                    // Disposición D-1853-2025-1 (Google Drive /preview)
                    url: "https://drive.google.com/file/d/1y_zfzXN_St_Udw8v9fLTJpMBZF0UALy3/preview", 
                    tabTitle: "DISPOSICIÓN D-1853-2025-1" 
                }
            ]
        };
    </script>
    
    <!-- Contenedor Principal para inyectar el contenido -->
    <div id="app-container">
        <!-- El contenido será inyectado aquí por el script -->
    </div>


    <!-- 
        ===================================================================
        PASO 2: LÓGICA DE RENDERIZADO (NO NECESITA MODIFICACIÓN)
        ===================================================================
    -->
    <script>
        
        /**
         * Renderiza el bloque de una sola fotografía.
         * @param {object} photo - Datos de la foto.
         * @param {string} address - Dirección del inmueble.
         * @param {string} date - Fecha del relevamiento.
         * @param {number} index - Índice de la foto para numeración.
         * @returns {string} HTML del bloque de foto.
         */
        const renderPhotoBlock = (photo, address, date, index) => {
            const isVertical = photo.aspect === '3/4';
            const gridClass = isVertical ? 'col-span-1' : 'w-full';
            const aspectRatioClass = isVertical ? 'aspect-[3/4]' : 'aspect-[4/3]';
            const placeholderSize = isVertical ? '900x1200' : '1200x900';

            return `
                <div class="${gridClass}">
                    <figure class="border-2 border-gray-300 p-1 rounded-lg shadow-md bg-white">
                        <img 
                            src="${photo.url}" 
                            alt="${photo.alt || 'FOTOGRAFÍA ' + index}" 
                            class="w-full ${aspectRatioClass} object-cover rounded-md"
                            onerror="this.onerror=null; this.src='https://placehold.co/${placeholderSize}/CCCCCC/666666?text=IMAGEN+NO+DISPONIBLE'; this.classList.add('p-8', 'bg-gray-100');"
                        />
                        <figcaption class="mt-2 text-sm text-gray-600 font-semibold p-2">
                            FOTOGRAFÍA ${index}: ${photo.caption}
                            <br>
                            <span class="font-normal text-xs text-gray-400">
                                DOMICILIO: ${address} - Fecha: ${date}
                            </span>
                        </figcaption>
                        <p class="text-xs italic text-gray-400 px-2 pb-2">Fuente: Agencia Gubernamental de Control</p>
                    </figure>
                </div>
            `;
        };

        /**
         * Función auxiliar para obtener y actualizar el contenido de una meta etiqueta
         * @param {string} propertyName - El valor del atributo 'property' (ej: 'og:title').
         * @param {string} contentValue - El nuevo valor para el atributo 'content'.
         */
        function updateMetaTag(propertyName, contentValue) {
            let metaTag = document.querySelector(`meta[property="${propertyName}"]`);
            if (metaTag) {
                metaTag.setAttribute('content', contentValue);
            }
        }

        /**
         * Renderiza la estructura principal y el contenido dinámico.
         * @param {object} data - El objeto currentCaseData.
         */
        function renderDocument(data) {
            // 1. Actualizar metadatos de la página (Título principal)
            const fullTitle = `RELEVAMIENTO FOTOGRÁFICO - Expte ${data.expedient}`;
            document.getElementById('doc-title').textContent = fullTitle;

            // 2. Actualizar meta etiquetas Open Graph DINÁMICAS (Solo Título/Descripción)
            updateMetaTag('og:title', fullTitle);
            updateMetaTag('og:description', `Detalles del expediente ${data.title} en ${data.address}. Incluye fotografías y documentos anexos.`);
            
            // 3. Separar fotos horizontales y verticales
            const horizontalPhotos = data.photos.filter(p => p.aspect === '4/3');
            const verticalPhotos = data.photos.filter(p => p.aspect === '3/4');

            let photoIndex = 1;
            
            // 4. Generar HTML de fotos horizontales y verticales
            const horizontalHtml = horizontalPhotos.map(photo => {
                return renderPhotoBlock(photo, data.address, data.date, photoIndex++);
            }).join('');

            const verticalHtml = verticalPhotos.map(photo => {
                return renderPhotoBlock(photo, data.address, data.date, photoIndex++);
            }).join('');

            // 5. Generar HTML de pestañas de PDF y su contenido
            let tabButtonsHtml = '';
            let pdfContentsHtml = '';
            
            data.pdfs.forEach((pdf, index) => {
                const id = `pdf${index + 1}`;
                const tabId = `tab-${index + 1}`;
                const isFirst = index === 0;
                
                // Botón de la pestaña
                tabButtonsHtml += `
                    <button 
                        id="${tabId}" 
                        onclick="showPdf('${id}')" 
                        class="tab-button py-2 px-4 text-lg font-medium rounded-t-lg transition duration-150 ${isFirst ? 'bg-red-600 text-white' : 'text-gray-600 hover:text-red-600 hover:bg-gray-100'} ${index > 0 ? 'ml-2' : ''}"
                    >
                        ${pdf.tabTitle}
                    </button>
                `;

                // Contenedor del PDF. 
                pdfContentsHtml += `
                    <div id="${id}" class="pdf-content mt-4 ${isFirst ? '' : 'hidden'}">
                        <iframe 
                            src="${pdf.url}" 
                            class="pdf-iframe shadow-lg rounded-lg"
                            title="${pdf.tabTitle}"
                            aria-label="Documento PDF de ${pdf.tabTitle} incrustado"
                        ></iframe>
                    </div>
                `;
            });


            // 6. Ensamblar todo el HTML de la página
            const fullHtml = `
                <!-- Área de Impresión (simulando el documento) -->
                <main class="print-area p-8 border border-gray-300 rounded-xl">
                    
                    <!-- CABECERA DEL DOCUMENTO -->
                    <header class="text-center mb-10">
                        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-1">MUNICIPALIDAD DE RECONQUISTA</h1>
                        <h2 class="text-base sm:text-xl font-medium text-gray-600 border-b-2 border-blue-600 pb-2 inline-block">Secretaría de Control Público - Agencia Gubernamental de Control.</h2>
                    </header>

                    <!-- INFORMACIÓN DEL EXPEDIENTE -->
                    <section class="mb-8 p-4 bg-blue-50/70 border-l-4 border-blue-600 rounded-lg">
                        <h3 class="text-xl font-semibold text-gray-800 mb-2">RELEVAMIENTO FOTOGRÁFICO</h3>
                        <p class="text-lg text-gray-700 font-mono">
                            Expte ${data.expedient} "<span class="font-bold text-blue-700">${data.title}</span>"
                        </p>
                    </section>

                    <!-- SECCIÓN DE FOTOS HORIZONTALES -->
                    <section class="mb-12">
                        <h4 class="text-2xl font-bold text-gray-700 border-b-2 pb-2 mb-6">Fotografías Horizontales</h4>
                        <div class="space-y-10">
                            ${horizontalHtml}
                        </div>
                    </section>

                    <!-- SECCIÓN DE FOTOS VERTICALES -->
                    <section class="mt-12">
                        <h4 class="text-2xl font-bold text-gray-700 border-b-2 pb-2 mb-6">Fotografías Verticales</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-8">
                            ${verticalHtml}
                        </div>
                    </section>
                    
                    <footer class="mt-12 pt-4 text-center border-t border-gray-300 text-xs text-gray-500 print:text-gray-900">
                        Documento generado para Expte "${data.title}".
                    </footer>
                </main>

                <!-- SECCIÓN DE DOCUMENTOS ANEXOS (Fuera del print-area) -->
                <section class="pdf-container mt-12 mb-8 print-area p-8 border border-gray-300 rounded-xl bg-white shadow-xl">
                    <h3 class="text-3xl font-bold text-gray-900 border-b-4 border-red-500 pb-3 mb-6">Documentos Anexos</h3>
                    
                    <!-- Pestañas de navegación -->
                    <div class="flex border-b border-gray-200">
                        ${tabButtonsHtml}
                    </div>

                    <!-- Contenedores de PDF -->
                    ${pdfContentsHtml}

                    <p class="text-sm text-gray-500 mt-4 italic">
                        Nota: Los documentos PDF se cargan directamente desde Google Drive (en modo previsualización). Deben estar configurados como públicos para funcionar correctamente.
                    </p>
                </section>

                <!-- Contenedor del Botón de Imprimir -->
                <div class="print-button-container flex justify-center mt-6 mb-6">
                    <button 
                        onclick="window.print()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-xl transition duration-200 focus:outline-none focus:ring-4 focus:ring-blue-300 flex items-center space-x-2"
                    >
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M5 4a3 3 0 013-3h4a3 3 0 013 3v2h2a2 2 0 012 2v8a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h2V4zm2 0a1 1 0 00-1 1v2h6V5a1 1 0 00-1-1H7zm11 9H2a1 1 0 00-1 1v2a1 1 0 001 1h16a1 1 0 001-1v-2a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span>Imprimir Documento (Guardar como PDF)</span>
                    </button>
                </div>
            `;

            // Inyectar el HTML generado en el contenedor principal
            document.getElementById('app-container').innerHTML = fullHtml;
        }

        /**
         * Función para cambiar entre pestañas de PDF (se mantiene)
         */
        function showPdf(pdfId) {
            // Oculta todos los contenidos
            document.querySelectorAll('.pdf-content').forEach(content => {
                content.classList.add('hidden');
            });

            // Muestra el contenido seleccionado
            document.getElementById(pdfId).classList.remove('hidden');

            // Actualiza el estilo de los botones de pestaña
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('bg-red-600', 'text-white');
                button.classList.add('text-gray-600', 'hover:text-red-600', 'hover:bg-gray-100');
            });
            
            // Pestaña activa
            const activeButton = document.getElementById('tab-' + pdfId.replace('pdf', ''));
            if (activeButton) {
                activeButton.classList.add('bg-red-600', 'text-white');
                activeButton.classList.remove('text-gray-600', 'hover:text-red-600', 'hover:bg-gray-100');
            }
        }

        // Ejecutar el renderizado al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderDocument(currentCaseData);
            // Asegurar que la primera pestaña esté activa después de renderizar
            showPdf('pdf1');
        });
    </script>

</body>
</html>
